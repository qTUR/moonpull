name: Android bundle
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle -p android bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: moonpull-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
      - name: Keep the bundle on the android-build branch
        run: |
          mkdir out && cp android/app/build/outputs/bundle/release/*.aab out/moonpull-unsigned.aab
          cd out && git init -q -b android-build
          git config user.name qTUR && git config user.email qTUR@users.noreply.github.com
          git add . && git commit -q -m "Android bundle"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" android-build
